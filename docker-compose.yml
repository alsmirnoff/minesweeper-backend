
services:
  # База данных
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: minesweeper_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d minesweeper_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Приложение
  app:
    build:
      context: .
      dockerfile:  Dockerfile
    container_name: minesweeper-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  grafana_data: